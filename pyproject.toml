[project]
name = "github-mcp-ext"
version = "0.1.0"
description = "GitHub MCP server extension for missing REST API operations"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.scripts]
github-mcp-ext = "github_mcp_ext.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
